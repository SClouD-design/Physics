<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lớp Học Game — Ôn tập từ giáo án</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  #app{min-height:100vh;background:linear-gradient(135deg,#312e81,#5b21b6,#6d28d9);padding:22px 16px}
  .wrap{max-width:720px;margin:0 auto}
  .wrap-lg{max-width:860px;margin:0 auto}
  .white{color:#fff}.center{text-align:center}.muted{color:#6b7280}
  button{font-family:inherit}
  .topbar{display:flex;justify-content:space-between;align-items:center;max-width:860px;margin:0 auto 22px}
  .brand{background:none;border:none;color:#fff;font-weight:900;font-size:20px;display:flex;gap:8px;align-items:center;cursor:pointer}
  .pill{background:rgba(255,255,255,.15);color:#fff;border:none;font-weight:600;font-size:14px;padding:8px 12px;border-radius:999px;cursor:pointer;margin-left:8px}
  .pill:hover{background:rgba(255,255,255,.28)}
  .logo-badge{background:#fff;border-radius:20px;padding:14px 22px;max-width:300px;margin:0 auto 18px;box-shadow:0 10px 26px rgba(0,0,0,.22);display:flex;justify-content:center}
  .logo-badge img{max-width:100%;height:auto;display:block;max-height:100px}
  .logo-chip{background:#fff;border-radius:10px;padding:3px 7px;display:inline-flex;align-items:center;box-shadow:0 3px 8px rgba(0,0,0,.15)}
  .logo-chip img{height:24px;width:auto;display:block}
  .card{background:rgba(255,255,255,.96);border-radius:24px;padding:26px;box-shadow:0 20px 45px rgba(0,0,0,.28)}
  .btn{border:none;cursor:pointer;font-weight:900;border-radius:16px;color:#fff;transition:transform .1s ease}
  .btn:active{transform:scale(.95)}
  .btn:disabled{cursor:default;opacity:.6}
  .btn-lg{width:100%;padding:16px;font-size:19px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
  .btn:hover:not(:disabled){transform:scale(1.02)}
  .grad-primary{background:linear-gradient(135deg,#ec4899,#fb923c)}
  .grad-quiz{background:linear-gradient(135deg,#fbbf24,#f97316)}
  .grad-match{background:linear-gradient(135deg,#22d3ee,#3b82f6)}
  .grad-wheel{background:linear-gradient(135deg,#ec4899,#f43f5e)}
  .grad-tf{background:linear-gradient(135deg,#a3e635,#10b981)}
  .grad-fill{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
  .grad-indigo{background:linear-gradient(135deg,#6366f1,#a855f7)}
  .grad-green{background:linear-gradient(135deg,#34d399,#10b981)}
  .grad-emerald{background:linear-gradient(135deg,#34d399,#059669)}
  .grad-rose{background:linear-gradient(135deg,#fb7185,#dc2626)}
  .grad-violet{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
  .hero-emojis{font-size:34px;display:flex;gap:12px;justify-content:center;margin-bottom:10px}
  .title{font-size:52px;line-height:1.05;font-weight:900;color:#fff;letter-spacing:-1px;text-align:center;text-shadow:0 4px 12px rgba(0,0,0,.3)}
  .title span{color:#fde047}
  .subtitle{margin:12px 0 0;text-align:center;color:#ede9fe;font-size:17px;font-weight:500}
  .drop{cursor:pointer;border:4px dashed #a5b4fc;border-radius:18px;padding:30px;text-align:center;transition:.15s}
  .drop:hover{border-color:#6366f1;background:#eef2ff}
  .drop-emo{font-size:44px;margin-bottom:8px}
  .drop-title{font-size:18px;font-weight:800;color:#4338ca}
  .drop-sub{font-size:13px;color:#6b7280;margin-top:4px}
  .divider{display:flex;align-items:center;gap:12px;margin:20px 0}
  .divider .line{flex:1;height:1px;background:#e5e7eb}
  .divider span{font-size:13px;color:#9ca3af;font-weight:600}
  textarea{width:100%;height:128px;padding:16px;border-radius:16px;border:2px solid #e5e7eb;outline:none;resize:none;color:#374151;font-size:15px;font-family:inherit}
  textarea:focus{border-color:#818cf8}
  .link{background:none;border:none;color:#6366f1;font-weight:600;font-size:14px;cursor:pointer;padding:0}
  .link:hover{text-decoration:underline}
  .badge{display:inline-block;background:rgba(255,255,255,.2);color:#ede9fe;font-size:14px;font-weight:600;padding:5px 16px;border-radius:999px}
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
  .game-card{text-align:left;border:none;border-radius:24px;padding:20px;color:#fff;cursor:pointer;box-shadow:0 12px 26px rgba(0,0,0,.22);transition:transform .12s}
  .game-card:hover:not(:disabled){transform:scale(1.03)}
  .game-card:active:not(:disabled){transform:scale(.96)}
  .game-card:disabled{cursor:not-allowed;opacity:.55;background:rgba(148,163,184,.6)!important}
  .gc-top{display:flex;justify-content:space-between;align-items:center}
  .gc-emo{font-size:38px}
  .gc-count{background:rgba(255,255,255,.3);font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px}
  .gc-name{font-size:20px;font-weight:900;margin:12px 0 4px}
  .gc-desc{font-size:14px;opacity:.92;margin:0}
  .gf-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .gf-title{color:#fff;font-weight:900;font-size:20px;display:flex;gap:8px;align-items:center}
  .gf-right{color:#fff;font-weight:800}
  .progress{width:100%;height:12px;background:rgba(255,255,255,.2);border-radius:999px;overflow:hidden;margin-bottom:18px}
  .progress>i{display:block;height:100%;background:linear-gradient(90deg,#fde047,#f472b6);transition:width .3s}
  .qmeta{font-size:12px;font-weight:700;margin:0 0 6px}
  .qtext{font-size:21px;font-weight:700;color:#1f2937;margin:0 0 18px}
  .timer{font-weight:900;font-size:18px;color:#fde047}
  .timer.danger{color:#fca5a5}
  .opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:15px;border-radius:16px;border:2px solid #e0e7ff;background:#eef2ff;color:#374151;font-weight:600;font-size:15px;cursor:pointer;margin-bottom:11px;transition:.1s}
  .opt:hover:not(:disabled){background:#e0e7ff}
  .opt:disabled{cursor:default}
  .opt .lt{width:32px;height:32px;flex:none;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 2px 5px rgba(0,0,0,.12)}
  .opt.correct{background:#dcfce7;border-color:#4ade80;color:#166534}
  .opt.wrong{background:#fee2e2;border-color:#f87171;color:#991b1b}
  .opt.dim{background:#f9fafb;border-color:#f3f4f6;color:#9ca3af}
  .opt .rt{margin-left:auto}
  .explain{background:#fefce8;border:2px solid #fef08a;border-radius:16px;padding:12px;font-size:14px;color:#854d0e;margin-bottom:12px}
  input.answer{width:100%;padding:16px;border-radius:16px;border:2px solid #e0e7ff;outline:none;color:#374151;font-size:17px;font-family:inherit}
  input.answer:focus{border-color:#818cf8}
  input.answer.ok{border-color:#4ade80;background:#f0fdf4}
  input.answer.no{border-color:#f87171;background:#fef2f2}
  .tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
  .tf-btn{padding:26px 10px;border-radius:22px;border:none;color:#fff;font-size:24px;font-weight:900;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.18);transition:transform .1s}
  .tf-btn:active:not(:disabled){transform:scale(.95)}
  .tf-btn:hover:not(:disabled){transform:scale(1.04)}
  .tf-stage{text-align:center}
  .tf-q{font-size:26px;font-weight:700;color:#1f2937;min-height:86px;display:flex;align-items:center;justify-content:center}
  .ring-ok{box-shadow:0 0 0 8px #4ade80}
  .ring-no{box-shadow:0 0 0 8px #f87171}
  .wheel-box{display:flex;flex-direction:column;align-items:center;gap:24px;padding:10px 0}
  .wheel-outer{position:relative;width:260px;height:260px}
  .wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:34px;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
  .wheel{width:260px;height:260px;border-radius:50%;border:8px solid #fff;box-shadow:0 12px 30px rgba(0,0,0,.35);transition:transform 3s cubic-bezier(.17,.67,.2,1)}
  .wheel-hub{position:absolute;top:50%;left:50%;width:64px;height:64px;transform:translate(-50%,-50%);background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
  .mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .flip-card{height:108px;border:none;background:none;padding:0;cursor:pointer;perspective:700px}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
  .flip-card.flipped .flip-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(0,0,0,.18)}
  .face-back{background:linear-gradient(135deg,#d946ef,#4f46e5);font-size:30px}
  .face-front{background:#fff;color:#374151;font-size:13px;font-weight:600;text-align:center;padding:8px;transform:rotateY(180deg);line-height:1.25}
  .face-front.matched{background:#bbf7d0;color:#166534}
  .res-emo{font-size:60px;margin-bottom:6px}
  .res-title{font-size:28px;font-weight:900;color:#1f2937;margin:0}
  .stars{font-size:38px;margin:14px 0;letter-spacing:4px}
  .stars .off{opacity:.2}
  .score-box{background:#eef2ff;border-radius:18px;padding:16px;margin:6px 0 22px;text-align:center}
  .score-num{font-size:48px;font-weight:900;color:#4f46e5;margin:0}
  .score-lbl{color:#818cf8;font-weight:600;margin:2px 0 0}
  .loader{display:flex;flex-direction:column;align-items:center;gap:22px;padding:60px 0;text-align:center}
  .loader-emo{font-size:64px}
  .dots{display:flex;gap:8px}
  .dots i{width:16px;height:16px;border-radius:50%;background:#fde047;display:block;animation:bounceDot 1.2s infinite}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;padding:13px 20px;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.3);font-weight:600;z-index:60;max-width:360px;text-align:center;line-height:1.4}
  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
  .foot{text-align:center;color:#c4b5fd;font-size:12px;margin-top:16px}
  .foot b{color:#e9d5ff}
  @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes floatB{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
  @keyframes bounceDot{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1.1);opacity:1}}
  @keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  @keyframes popIn{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
  .float-a{animation:floatA 3s ease-in-out infinite}
  .float-b{animation:floatB 3.6s ease-in-out infinite}
  .shake{animation:shakeX .45s ease}
  .pop{animation:popIn .5s cubic-bezier(.2,1.2,.4,1)}
  @media(max-width:560px){
    .title{font-size:40px}
    .menu-grid{grid-template-columns:1fr}
    .mem-grid{grid-template-columns:repeat(2,1fr)}
    .card{padding:20px}
  }
</style>
</head>

function beep(freq,start,dur,type,gain){ type=type||"sine"; gain=gain||0.2; var c=actx(); if(!c)return; var t0=c.currentTime+start; var o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(gain,t0+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur); o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.03); }

function fireConfetti(){
  var cv=document.createElement("canvas"); cv.id="confetti"; document.body.appendChild(cv);
  cv.width=window.innerWidth; cv.height=window.innerHeight;
  var c=cv.getContext("2d");
  var colors=["#F472B6","#FACC15","#4ADE80","#22D3EE","#A78BFA","#FB923C","#F87171"];
  var parts=[]; for(var i=0;i<160;i++){parts.push({x:cv.width/2+(Math.random()-0.5)*120,y:cv.height/3,vx:(Math.random()-0.5)*16,vy:Math.random()*-15-5,s:Math.random()*9+5,color:colors[(Math.random()*colors.length)|0],rot:Math.random()*6,vr:(Math.random()-0.5)*0.35});}
  var g=0.4,raf;
  function step(){ c.clearRect(0,0,cv.width,cv.height); var alive=false; for(var k=0;k<parts.length;k++){var p=parts[k];p.vy+=g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;if(p.y<cv.height+30)alive=true;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.color;c.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.55);c.restore();} if(alive)raf=requestAnimationFrame(step); else cv.remove(); }
  step();
}

/* ===== GỌI BACKEND ===== */
function generateQuestions(text){
  var status=0;
  return fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:String(text).slice(0,12000)})})
    .then(function(res){ status=res.status; return res.text(); })
    .then(function(txt){
      var data=null;
      try{ data=JSON.parse(txt); }catch(e){
        var hint;
        if(status===404) hint="Không tìm thấy /api/generate (mã 404). Thư mục 'api' có thể chưa được đưa lên đúng chỗ. Kiểm tra trên GitHub file phải nằm ở đường dẫn api/generate.js.";
        else if(status>=500) hint="Backend bị lỗi khi chạy (mã "+status+"). Vào Vercel → Deployments → mở bản mới nhất → tab Logs để xem chi tiết.";
        else hint="Máy chủ trả về nội dung không phải JSON (mã "+status+"). Kiểm tra lại phần backend.";
        throw new Error(hint);
      }
      if(status<200||status>=300) throw new Error((data&&data.error)||("Lỗi máy chủ ("+status+")"));
      return data;
    })
    .then(function(p){
      return {title:p.title||"Bài ôn tập",
        mcq:Array.isArray(p.mcq)?p.mcq:[],
        truefalse:Array.isArray(p.truefalse)?p.truefalse:[],
        fill:Array.isArray(p.fill)?p.fill:[],
        match:Array.isArray(p.match)?p.match:[]};
    });
}

/* ===== TIỆN ÍCH ===== */
function shuffle(a){var x=a.slice();for(var i=x.length-1;i>0;i--){var j=(Math.random()*(i+1))|0;var t=x[i];x[i]=x[j];x[j]=t;}return x;}
function norm(s){return (s==null?"":String(s)).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");}
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fillOk(input,answer){var a=norm(input),b=norm(answer);return a===b||(b.length>=4&&a.indexOf(b)>=0);}

/* ===== DỮ LIỆU TỪNG GAME ===== */
function buildSubset(id){
  var d=state.data; if(!d)return [];
  if(id==="quiz"){
    var q=d.mcq.length?d.mcq:d.truefalse.map(function(t){return {q:t.q,options:["Đúng","Sai"],answer:t.answer?0:1,explain:t.explain}});
    return q.filter(function(x){return x.options&&x.options.length>=2});
  }
  if(id==="match"){
    var pairs=d.match.slice();
    if(pairs.length<4){d.mcq.forEach(function(m){if(pairs.length<8&&m.options)pairs.push({term:m.q,definition:m.options[m.answer]});});}
    return pairs.filter(function(p){return p.term&&p.definition}).slice(0,8);
  }
  if(id==="wheel"){
    var pool=[]
      .concat(d.mcq.map(function(x){var o=Object.assign({},x);o.kind="mcq";return o;}))
      .concat(d.truefalse.map(function(x){var o=Object.assign({},x);o.kind="tf";return o;}))
      .concat(d.fill.map(function(x){var o=Object.assign({},x);o.kind="fill";return o;}));
    return pool.slice(0,10);
  }
  if(id==="tf")return d.truefalse;
  if(id==="fill")return d.fill;
  return [];
}
function counts(){
  var d=state.data; if(!d)return {};
  var m=buildSubset("match");
  return {quiz:buildSubset("quiz").length,match:m.length>=4?m.length:0,wheel:buildSubset("wheel").length,tf:d.truefalse.length,fill:d.fill.length,total:d.mcq.length+d.truefalse.length+d.fill.length+d.match.length};
}

  setTimeout(function(){if(t.parentNode)t.remove();},4200);
}

function readFile(f,ta){
  if(!f)return; play("click");
  document.getElementById("dropTitle").textContent=f.name;
  document.getElementById("dropEmo").textContent="📄";
  var name=f.name.toLowerCase();
  if(name.slice(-5)===".docx"){
    if(!window.mammoth){toast("Chưa tải được bộ đọc .docx. Bạn hãy dán nội dung vào ô bên dưới nhé.");return;}
    f.arrayBuffer().then(function(buf){return mammoth.extractRawText({arrayBuffer:buf});})
      .then(function(out){ta.value=out.value||"";ta.oninput();})
      .catch(function(){toast("Không đọc được file này. Bạn hãy thử dán nội dung nhé.");});
  } else {
    f.text().then(function(t){ta.value=t;ta.oninput();}).catch(function(){toast("Không đọc được file này.");});
  }
}

/* ---- GAME 1 ---- */
function gameQuiz(stage,questions){
  var idx=0,score=0,streak=0,sel=null,answered=false,time=20,timer=null,shake=false;
  var LT=["A","B","C","D","E"];
  cleanup=function(){if(timer){clearInterval(timer);timer=null;}};
  function startTimer(){
    time=20; if(timer)clearInterval(timer);
    timer=setInterval(function(){
      time--;
      if(time<=0){clearInterval(timer);timer=null;if(!answered){answered=true;sel=-1;streak=0;play("wrong");draw();}return;}
      if(time<=6)play("tick");
      var e=document.getElementById("qtime");if(e){e.textContent="⏱ "+time+"s";e.className=time<=6?"timer danger":"timer";}
    },1000);
  }
  function choose(i){if(answered)return;answered=true;sel=i;if(timer){clearInterval(timer);timer=null;}
    if(i===questions[idx].answer){score++;streak++;play("correct");}else{streak=0;shake=true;play("wrong");}draw();}
  function next(){play("click");if(idx+1<questions.length){idx++;sel=null;answered=false;shake=false;draw();startTimer();}else{finish(score,questions.length);}}
  function draw(){
    var q=questions[idx];
    var opts=q.options.map(function(opt,i){
      var cls="opt";
      if(answered){ if(i===q.answer)cls="opt correct"; else if(i===sel)cls="opt wrong"; else cls="opt dim"; }
      var rt=""; if(answered&&i===q.answer)rt='<span class="rt">✅</span>'; else if(answered&&i===sel&&i!==q.answer)rt='<span class="rt">❌</span>';
      return '<button class="'+cls+'" data-i="'+i+'" '+(answered?"disabled":"")+'><span class="lt">'+LT[i]+'</span><span>'+esc(opt)+'</span>'+rt+'</button>';
    }).join("");
    var after=""; if(answered){after='<div style="margin-top:18px">'+(q.explain?'<div class="explain">💡 '+esc(q.explain)+'</div>':'')+
      '<button class="btn btn-lg grad-indigo" id="nextBtn">'+(idx+1<questions.length?"Câu tiếp theo →":"Xem kết quả 🏁")+'</button></div>';}
    var right='⭐ '+score+(streak>=2?' · 🔥'+streak:'');
    var inner='<div style="text-align:right;margin-bottom:8px"><span class="'+(time<=6?"timer danger":"timer")+'" id="qtime">⏱ '+time+'s</span></div>'+
      '<div class="card'+(shake?' shake':'')+'"><p class="qmeta" style="color:#818cf8">Câu '+(idx+1)+'/'+questions.length+'</p>'+
      '<p class="qtext">'+esc(q.q)+'</p>'+opts+after+'</div>';
    stage.innerHTML=frame("Rung Chuông Vàng","🔔",((idx+(answered?1:0))/questions.length)*100,right,inner);
    if(!answered){var bs=stage.querySelectorAll(".opt");for(var i=0;i<bs.length;i++){(function(b){b.onclick=function(){choose(parseInt(b.getAttribute("data-i")));};})(bs[i]);}}
    var nb=document.getElementById("nextBtn");if(nb)nb.onclick=next;
    if(shake)setTimeout(function(){shake=false;var cd=stage.querySelector(".card");if(cd)cd.classList.remove("shake");},450);
  }
  draw();startTimer();
}

/* ---- GAME 2 ---- */
function gameMatch(stage,pairs){
  var deck=[];pairs.forEach(function(p,i){deck.push({pid:i,text:p.term});deck.push({pid:i,text:p.definition});});
  deck=shuffle(deck);
  var flipped=[],matched=[],moves=0,busy=false,timeouts=[];
  cleanup=function(){timeouts.forEach(clearTimeout);};
  function head(){return '⭐ '+matched.length+'/'+pairs.length+' · 🔄 '+moves;}
  function updateHead(){var e=document.getElementById("matchHead");if(e)e.textContent=head();var pr=document.getElementById("matchProg");if(pr)pr.style.width=((matched.length/pairs.length)*100)+"%";}
  function setCard(i){var c=stage.querySelector('[data-ci="'+i+'"]');if(!c)return;var card=deck[i];var show=flipped.indexOf(i)>=0||matched.indexOf(card.pid)>=0;c.className="flip-card"+(show?" flipped":"");var f=c.querySelector(".face-front");f.className="face-front"+(matched.indexOf(card.pid)>=0?" matched":"");}
  function click(i){
    if(busy)return; var card=deck[i];
    if(flipped.indexOf(i)>=0||matched.indexOf(card.pid)>=0)return;
    play("flip");flipped.push(i);setCard(i);
    if(flipped.length===2){
      moves++;busy=true;updateHead();
      var a=flipped[0],b=flipped[1];
      if(deck[a].pid===deck[b].pid){
        timeouts.push(setTimeout(function(){matched.push(deck[a].pid);flipped=[];busy=false;setCard(a);setCard(b);play("correct");updateHead();if(matched.length===pairs.length){timeouts.push(setTimeout(function(){finish(pairs.length,pairs.length);},500));}},500));
      } else {
        play("wrong");
        timeouts.push(setTimeout(function(){var x=flipped[0],y=flipped[1];flipped=[];busy=false;setCard(x);setCard(y);},900));
      }
    }
  }
  var cards=deck.map(function(c,i){return '<button class="flip-card" data-ci="'+i+'"><div class="flip-inner"><div class="face face-back">❓</div><div class="face face-front">'+esc(c.text)+'</div></div></button>';}).join("");
  var inner='<p class="center" style="color:#ede9fe;font-size:14px;margin:0 0 16px">Lật 2 thẻ để tìm cặp khái niệm – ý nghĩa khớp nhau</p><div class="mem-grid">'+cards+'</div>';
  stage.innerHTML='<div class="wrap"><div class="gf-head"><div class="gf-title">🃏 Lật Thẻ Ghép Đôi</div><div class="gf-right" id="matchHead">'+head()+'</div></div>'+
    '<div class="progress"><i id="matchProg" style="width:0%"></i></div>'+inner+'</div>';
  var bs=stage.querySelectorAll(".flip-card");for(var i=0;i<bs.length;i++){(function(b){var ci=parseInt(b.getAttribute("data-ci"));b.onclick=function(){click(ci);};})(bs[i]);}
}

/* ---- GAME 3 ---- */
function gameWheel(stage,pool){
  var order=shuffle(pool),round=0,phase="ready",angle=0,score=0,sel=null,answered=false,timeouts=[];
  cleanup=function(){timeouts.forEach(clearTimeout);};
  var colors=["#F472B6","#FBBF24","#4ADE80","#22D3EE","#A78BFA","#FB923C","#F87171","#34D399"],seg=8;
  var stops=colors.map(function(c,i){return c+" "+(i*360/seg)+"deg "+((i+1)*360/seg)+"deg";}).join(", ");
  function grade(ok){answered=true;if(ok){score++;play("correct");}else play("wrong");draw();}
  function next(){play("click");if(round+1<order.length){round++;phase="ready";sel=null;answered=false;draw();}else{finish(score,order.length);}}
  function spin(){if(phase!=="ready")return;play("spin");phase="spinning";draw();
    angle+=360*5+Math.floor(Math.random()*360);
    var w=document.getElementById("wheelEl");if(w)requestAnimationFrame(function(){w.style.transform="rotate("+angle+"deg)";});
    timeouts.push(setTimeout(function(){phase="question";draw();},3100));}
  function draw(){
    var right='⭐ '+score+' · Lượt '+(round+1)+'/'+order.length;
    var inner;
    if(phase!=="question"){
      inner='<div class="wheel-box"><div class="wheel-outer"><div class="wheel-pointer">🔻</div>'+
        '<div class="wheel" id="wheelEl" style="background:conic-gradient('+stops+');transform:rotate('+angle+'deg)"></div>'+
        '<div class="wheel-hub">🎯</div></div>'+
        '<button class="btn" id="spinBtn" '+(phase==="spinning"?"disabled":"")+' style="padding:16px 40px;font-size:20px;'+(phase==="spinning"?"background:#9ca3af":"")+'">'+
        (phase==="spinning"?"Đang quay…":"QUAY 🎡")+'</button></div>';
      stage.innerHTML=frame("Vòng Quay May Mắn","🎡",(round/order.length)*100,right,inner);
      var sb=document.getElementById("spinBtn");
      if(sb){if(phase!=="spinning")sb.classList.add("grad-wheel");sb.onclick=spin;}
      return;
    }
    var q=order[round];
    var kindLbl=q.kind==="mcq"?"Trắc nghiệm":q.kind==="tf"?"Đúng / Sai":"Điền từ";
    var body="";
    if(q.kind==="mcq"){
      body=q.options.map(function(opt,i){var cls="opt";if(answered){if(i===q.answer)cls="opt correct";else if(i===sel)cls="opt wrong";else cls="opt dim";}return '<button class="'+cls+'" data-i="'+i+'" '+(answered?"disabled":"")+'><span>'+esc(opt)+'</span></button>';}).join("");
    } else if(q.kind==="tf"){
      body='<div class="tf-grid">'+[true,false].map(function(v){var lbl=v?"✅ ĐÚNG":"❌ SAI";var cls=v?"tf-btn grad-emerald":"tf-btn grad-rose";if(answered){if(v===q.answer)cls="tf-btn grad-green";else if(v===sel)cls="tf-btn grad-rose";else cls="tf-btn";}var st=(answered&&v!==q.answer&&v!==sel)?' style="background:#f3f4f6;color:#9ca3af"':'';return '<button class="'+cls+'" data-v="'+v+'" '+(answered?"disabled":"")+st+'>'+lbl+'</button>';}).join("")+'</div>';
    } else {
      body='<input class="answer" id="wfill" '+(answered?"disabled":"")+' placeholder="Nhập câu trả lời…">'+
        (answered?'<p style="margin-top:12px;font-weight:600;color:#4b5563">Đáp án đúng: <span style="color:#16a34a">'+esc(q.answer)+'</span></p>':'<button class="btn btn-lg grad-indigo" id="wcheck" style="margin-top:12px">Kiểm tra</button>');
    }
    var after=""; if(answered){after='<div style="margin-top:16px">'+(q.explain?'<div class="explain">💡 '+esc(q.explain)+'</div>':'')+'<button class="btn btn-lg grad-wheel" id="wnext">'+(round+1<order.length?"Quay tiếp 🎡":"Xem kết quả 🏁")+'</button></div>';}
    inner='<div class="card"><p class="qmeta" style="color:#ec4899">'+kindLbl+'</p><p class="qtext">'+esc(q.q)+'</p>'+body+after+'</div>';
    stage.innerHTML=frame("Vòng Quay May Mắn","🎡",(round/order.length)*100,right,inner);
    if(!answered){
      if(q.kind==="mcq"){var bs=stage.querySelectorAll(".opt");for(var i=0;i<bs.length;i++){(function(b){b.onclick=function(){sel=parseInt(b.getAttribute("data-i"));grade(sel===q.answer);};})(bs[i]);}}
      else if(q.kind==="tf"){var ts=stage.querySelectorAll(".tf-btn");for(var j=0;j<ts.length;j++){(function(b){b.onclick=function(){sel=(b.getAttribute("data-v")==="true");grade(sel===q.answer);};})(ts[j]);}}
      else{var ck=document.getElementById("wcheck");var inp=document.getElementById("wfill");if(ck)ck.onclick=function(){if(!inp.value.trim())return;grade(fillOk(inp.value,q.answer));};if(inp)inp.onkeydown=function(e){if(e.key==="Enter"&&inp.value.trim())grade(fillOk(inp.value,q.answer));};}
    }
    var wn=document.getElementById("wnext");if(wn)wn.onclick=next;
  }
  draw();
}

/* ---- GAME 4 ---- */
function gameTF(stage,items){
  var idx=0,score=0,combo=0,flash=null,timeouts=[];
  cleanup=function(){timeouts.forEach(clearTimeout);};
  function answer(v){
    if(flash)return;var q=items[idx];var ok=(v===q.answer);
    if(ok){score++;combo++;play("correct");}else{combo=0;play("wrong");}
    flash=ok?"ok":"no";draw();
    timeouts.push(setTimeout(function(){flash=null;if(idx+1<items.length){idx++;draw();}else{finish(score,items.length);}},950));
  }
  function draw(){
    var q=items[idx];
    var right='⭐ '+score+(combo>=2?' · ⚡x'+combo:'');
    var ring=flash==="ok"?" ring-ok":flash==="no"?" ring-no shake":"";
    var inner='<div class="card tf-stage'+ring+'"><p class="qmeta" style="color:#10b981">Mệnh đề '+(idx+1)+'/'+items.length+'</p>'+
      '<p class="tf-q">'+esc(q.q)+'</p>'+(flash&&q.explain?'<p style="font-size:14px;color:#6b7280;margin-top:6px">💡 '+esc(q.explain)+'</p>':'')+'</div>'+
      '<div class="tf-grid"><button class="tf-btn grad-emerald" id="tTrue" '+(flash?"disabled":"")+'>✅ ĐÚNG</button>'+
      '<button class="tf-btn grad-rose" id="tFalse" '+(flash?"disabled":"")+'>❌ SAI</button></div>';
    stage.innerHTML=frame("Đúng Hay Sai","🎯",(idx/items.length)*100,right,inner);
    var tt=document.getElementById("tTrue"),tf=document.getElementById("tFalse");
    if(tt&&!flash)tt.onclick=function(){answer(true);};
    if(tf&&!flash)tf.onclick=function(){answer(false);};
  }
  draw();
}

/* ---- GAME 5 ---- */
function gameFill(stage,items){
  var idx=0,score=0,checked=false,correct=false;
  cleanup=function(){};
  function check(val){if(checked||!val.trim())return;correct=fillOk(val,items[idx].answer);checked=true;if(correct)score++;play(correct?"correct":"wrong");draw(val);}
  function next(){play("click");if(idx+1<items.length){idx++;checked=false;correct=false;draw("");}else{finish(score,items.length);}}
  function draw(val){
    var q=items[idx];val=val||"";
    var inpCls="answer"+(checked?(correct?" ok":" no"):"");
    var res=""; if(checked){res='<div style="margin-top:12px"><p style="font-weight:900;font-size:18px;color:'+(correct?"#16a34a":"#ef4444")+';margin:0">'+(correct?"🎉 Chính xác!":"😅 Chưa đúng")+'</p>'+
      (!correct?'<p style="font-size:14px;color:#4b5563;margin:4px 0 0">Đáp án: <b style="color:#16a34a">'+esc(q.answer)+'</b></p>':'')+
      (q.explain?'<p style="font-size:14px;color:#6b7280;margin:4px 0 0">💡 '+esc(q.explain)+'</p>':'')+'</div>';}
    var inner='<div class="card"><p class="qmeta" style="color:#8b5cf6">Câu '+(idx+1)+'/'+items.length+'</p>'+
      '<p class="qtext" style="line-height:1.5">'+esc(q.q)+'</p>'+
      '<input class="'+inpCls+'" id="fin" '+(checked?"disabled":"")+' value="'+esc(val)+'" placeholder="Gõ từ còn thiếu…">'+res+
      '<button class="btn btn-lg grad-violet" id="fbtn" style="margin-top:16px">'+(!checked?"Kiểm tra":(idx+1<items.length?"Câu tiếp theo →":"Xem kết quả 🏁"))+'</button></div>';
    stage.innerHTML=frame("Điền Từ Còn Thiếu","✏️",(idx/items.length)*100,'⭐ '+score,inner);
    var inp=document.getElementById("fin"),btn=document.getElementById("fbtn");
    if(inp&&!checked){inp.focus();inp.onkeydown=function(e){if(e.key==="Enter")check(inp.value);};}
    btn.onclick=function(){if(checked)next();else check(inp?inp.value:"");};
  }
  draw("");
}

function renderResult(stage){
  var score=state.result.score,total=state.result.total;
  var pct=total?Math.round((score/total)*100):0;
  var stars=pct>=90?3:pct>=60?2:1;
  var msg=pct>=90?"Xuất sắc! 🌟":pct>=60?"Làm tốt lắm! 👏":pct>=30?"Cố lên nào! 💪":"Ôn thêm chút nhé! 📚";
  var starHtml=""; for(var s=1;s<=3;s++){starHtml+='<span class="'+(s<=stars?"":"off")+'">⭐</span>';}
  stage.innerHTML='<div style="max-width:420px;margin:0 auto"><div class="card center pop">'+
    '<div class="res-emo">'+(pct>=60?"🏆":"🎈")+'</div><p class="res-title">'+msg+'</p>'+
    '<div class="stars">'+starHtml+'</div>'+
    '<div class="score-box"><p class="score-num">'+score+'/'+total+'</p><p class="score-lbl">đúng ('+pct+'%)</p></div>'+
    '<button class="btn btn-lg grad-green" id="replayBtn">🔄 Chơi lại</button>'+
    '<button class="btn btn-lg grad-indigo" id="menuBtn" style="margin-top:12px">🎮 Đổi trò chơi khác</button>'+
    '<button class="btn btn-lg" id="newBtn2" style="margin-top:12px;background:#f3f4f6;color:#4b5563">📄 Ôn bài mới</button>'+
  '</div><p class="foot">Tác giả: <b>Mạc Như Tiên</b></p></div>';
  if(pct>=60){play("win");fireConfetti();}else play("lose");
  document.getElementById("replayBtn").onclick=function(){play("click");goto("play");};
  document.getElementById("menuBtn").onclick=function(){play("click");goto("menu");};
  document.getElementById("newBtn2").onclick=function(){play("click");newLesson();};
}

render();
</script>
